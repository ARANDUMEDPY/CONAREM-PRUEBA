<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards · Arandú Med</title>
<meta name="theme-color" content="#0B1318">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: mazo de fichas apiladas; frente oscuro con banda de color por área, dorso verde azulado; selector de banco CONAREM / UNA */
:root{
  --bg:#0B1318; --ink:#0E161B; --panel:#121D24; --line:#24323B; --fg:#E7EEF1; --mut:#8EA0AA;
  --paper:#0F2A2B; --paper-ink:#EEF4F3; --paper-mut:#86B3AD;
  --teal:#4CC2B7; --orange:#F08A5D; --amber:#F7B731; --ok:#3FBF7F; --acc:#4CC2B7;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
body.una{--acc:#F2C14E;--paper:#151C3D}
*{box-sizing:border-box}
body{background:radial-gradient(900px 600px at 100% -10%,#123A3A55,transparent 70%),radial-gradient(700px 500px at -10% 110%,#5a2a1533,transparent 70%),var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh}
body.una{background:radial-gradient(900px 600px at 100% -10%,#2a338a66,transparent 70%),radial-gradient(700px 500px at -10% 110%,#5a4a1533,transparent 70%),#0A0F24}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-head);font-weight:700;font-size:1.15rem}.brand span{color:var(--teal)}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;border-radius:999px;padding:5px 10px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat i{width:8px;height:8px;border-radius:50%}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px}
.bank button{font:inherit;font-weight:700;font-size:.9rem;color:var(--mut);background:transparent;border:0;border-radius:12px;padding:9px 6px;cursor:pointer}
.bank button[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
@media(max-width:520px){.bank{grid-template-columns:1fr 1fr}}
.sub{margin:-4px 0 14px;font-size:.88rem;color:var(--mut)}
.gl{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:calc(.8rem * var(--k,1));line-height:1.45;color:var(--mut)}
.gl p{margin:3px 0}.gl b{color:var(--acc);font-weight:700}.gl .gh{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.trow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(1.35rem,5vw,1.8rem);line-height:1.08;margin:0;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--acc)}
.fsz{display:flex;align-items:center;flex-shrink:0;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.fsz button{font:inherit;font-family:var(--f-head);font-weight:700;color:var(--fg);background:transparent;border:0;width:40px;height:36px;cursor:pointer}
.fsz button:disabled{color:var(--line);cursor:default}
.fsz span{font-size:.72rem;color:var(--mut);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex-shrink:0;font:inherit;font-size:.84rem;font-weight:600;color:var(--mut);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.filters button i{width:9px;height:9px;border-radius:50%}
.filters button[aria-pressed="true"]{color:var(--ink);background:var(--fg);border-color:var(--fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools select,.tools input[type=search]{font:inherit;font-size:.86rem;color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.tools select{flex:1 1 160px}.tools input[type=search]{flex:1 1 140px}
.tg{font:inherit;font-size:.84rem;font-weight:600;color:var(--mut);background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;cursor:pointer}
.tg[aria-pressed="true"]{color:var(--ink);background:var(--orange);border-color:var(--orange)}
.deck{position:relative;perspective:1700px;margin-top:8px}
.deck::before,.deck::after{content:"";position:absolute;left:14px;right:14px;top:-10px;bottom:16px;border-radius:28px;background:#18252D;border:1px solid var(--line);transform:rotate(-2.2deg);z-index:0}
.deck::after{left:26px;right:26px;top:-20px;bottom:30px;transform:rotate(2.6deg);background:#15212A}
.card{position:relative;z-index:1;height:min(560px,66vh);min-height:420px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.75,.2,1);border-radius:28px;outline:none;touch-action:pan-y}
.card.flip{transform:rotateY(180deg)}
.card:focus-visible{box-shadow:0 0 0 3px var(--orange)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px #0009}
.front{background:var(--panel);border:1.5px solid var(--line)}
.band{height:10px;background:var(--c);flex-shrink:0}
.fin{flex:1;display:flex;flex-direction:column;gap:12px;padding:20px 22px 18px;position:relative;min-height:0;overflow:auto}
.wm{position:absolute;right:-6px;bottom:-40px;font-family:var(--f-head);font-weight:700;font-size:260px;line-height:1;color:var(--c);opacity:.08;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tema{display:flex;flex-direction:column;gap:2px;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.tema small{font-size:.72rem;letter-spacing:.02em;text-transform:none;color:var(--mut);font-weight:600}
.yr{font-size:.76rem;color:var(--mut);font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.rep,.exc{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:4px 9px}
.rep{color:var(--ink);background:var(--orange);transform:rotate(-2deg)}
.exc{color:var(--amber);border:1.5px solid var(--amber)}
.kd{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:4px 9px;color:var(--c);border:1.5px solid var(--c)}
.q{font-family:var(--f-head);font-weight:600;font-size:calc(var(--k,1)*clamp(1.15rem,4.6vw,1.5rem));line-height:1.25;margin:auto 0;letter-spacing:-.01em;position:relative}
.tap{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.8rem;color:var(--mut)}
.tap svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{transform:rotateY(180deg);background:radial-gradient(500px 300px at 100% 0%,#ffffff12,transparent 70%),var(--paper);color:var(--paper-ink);border:1.5px solid #2B5554}
body.una .back{border-color:#2E3A7A}
.bin{flex:1;display:flex;flex-direction:column;gap:12px;padding:20px 22px 18px;overflow:auto;min-height:0}
.bin>*,.fin>*{flex-shrink:0}
.bin,.fin{scrollbar-width:thin;scrollbar-color:#ffffff33 transparent}
.lab{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-mut)}
.a{font-family:var(--f-head);font-weight:700;font-size:calc(var(--k,1)*clamp(1.2rem,5vw,1.6rem));line-height:1.18;letter-spacing:-.02em;padding-bottom:12px;border-bottom:2px dashed #ffffff22}
.d{margin:0;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;font-size:calc(var(--k,1)*1rem);line-height:1.55;color:#CFE0DD}
.d b{color:var(--amber);font-weight:700}
.src{margin-top:auto;font-size:.74rem;color:var(--paper-mut);display:flex;gap:8px;align-items:flex-start}
.src svg{flex-shrink:0;width:15px;height:15px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.arrow{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.arrow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pos{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center}
.pos span{font-size:.82rem;color:var(--mut);font-variant-numeric:tabular-nums}
.pbar{width:100%;height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.pbar i{height:100%}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{font:inherit;font-weight:700;font-size:1rem;border-radius:18px;padding:15px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.act svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.again{background:transparent;color:var(--orange);border:2px solid var(--orange)}
.know{background:var(--ok);color:#06210F;border:2px solid var(--ok);box-shadow:0 12px 30px #3FBF7F44}
.arrow:focus-visible,.act:focus-visible,.filters button:focus-visible,.bank button:focus-visible,.tg:focus-visible,.fsz button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.head a{color:inherit;text-decoration:none}
.back-l{font-size:.82rem;font-weight:600;color:var(--mut);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.back-l:hover{color:var(--fg)}
.bank button{position:relative}
.bank button .pr{display:block;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-top:1px}
.bank button .lk{font-size:.75em;margin-left:3px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{font:inherit;font-weight:700;font-size:.9rem;border-radius:14px;padding:11px 10px;cursor:pointer;border:1.5px solid var(--line);background:var(--panel);color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px}
.mode button[aria-pressed="true"]{border-color:var(--amber);color:var(--fg);background:color-mix(in srgb,var(--amber) 12%,var(--panel))}
.mode .ct{font-variant-numeric:tabular-nums;background:var(--amber);color:#1B1405;border-radius:999px;padding:1px 8px;font-size:.78rem}
.mnd{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:12px 12px 10px}
.mnd-h{font-size:.8rem;color:var(--mut);margin:0 4px 8px;display:flex;justify-content:space-between;gap:8px}
.mnd-h b{color:var(--amber)}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rb{font:inherit;border-radius:14px;padding:9px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);background:transparent;color:var(--fg)}
.rb .re{font-size:1.25rem;line-height:1.1}.rb b{font-size:.82rem}.rb small{font-size:.7rem;color:var(--mut);font-variant-numeric:tabular-nums}
.rb.r0{border-color:#E0605A88}.rb.r1{border-color:#F08A5D88}.rb.r2{border-color:#4CC2B788}.rb.r3{border-color:#3FBF7F88}
.rb:hover:not(:disabled){transform:translateY(-1px)}
.rb:disabled{opacity:.35;cursor:default}
.mnd-s{font-size:.75rem;color:var(--mut);text-align:center;margin:8px 0 0}
.lock{background:var(--panel);border:1.5px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.lock .ic{font-size:44px;line-height:1}
.lock h2{font-family:var(--f-head);margin:0;font-size:1.3rem}
.lock p{margin:0;color:var(--mut);max-width:42ch}
.btn{font:inherit;font-weight:700;text-decoration:none;border-radius:14px;padding:12px 18px;display:inline-flex;gap:8px;align-items:center;border:0;cursor:pointer;background:var(--acc);color:var(--ink)}
.btn.gh{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.adm{font-size:.78rem;color:var(--amber);border:1px dashed var(--amber);border-radius:12px;padding:8px 12px}
.done{padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;height:100%}
.done .ic{font-size:46px}.done b{font-family:var(--f-head);font-size:1.25rem}.done span{color:var(--mut);max-width:34ch}
[hidden]{display:none!important}

.empty{padding:40px 20px;text-align:center;color:var(--mut);margin:auto}
.foot{font-size:.78rem;color:var(--mut);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
/* ===== Rediseño ===== */
.wrap{gap:12px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;font:inherit;font-weight:700;font-size:.86rem;color:var(--mut);background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.tabs .pr{font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#ffffff14;border-radius:6px;padding:2px 5px}
.tabs .lk{font-size:.75em}
.hoy{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,var(--panel)),var(--panel) 60%);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hoy-t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hoy h1{font-size:1.25rem}
.hoy .sub{margin:0;font-size:.8rem}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:#0000002e;border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column}
.kpi b{font-family:var(--f-head);font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.7rem;color:var(--mut);line-height:1.25}
.kpi .k1 b{color:var(--amber)}.kpi .k2 b{color:var(--orange)}.kpi .k3 b{color:var(--ok)}
.cov{display:flex;flex-direction:column;gap:5px}
.cov small{font-size:.72rem;color:var(--mut);display:flex;justify-content:space-between}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.mode button{border:0;background:transparent;border-radius:10px;padding:9px 8px;font-size:.88rem}
.mode button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border:0}
.mode button[aria-pressed="true"] .ct{background:var(--amber);color:#1B1405}
#allTools{gap:8px!important;margin-top:0!important}
.ftog{display:flex;gap:8px;align-items:center}
.ftog .tg{padding:7px 10px;font-size:.8rem}
.cbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.cbar #n{font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums}
.fsz button{width:34px;height:30px}.fsz span{min-width:34px;font-size:.68rem}
.deck{margin-top:6px!important}
.card{height:clamp(330px,calc(100dvh - 380px),560px);min-height:330px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(transparent,var(--bg) 26%);padding:22px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock-row{display:flex;gap:10px;align-items:stretch}
.dock .arrow{width:52px;height:auto;min-height:52px;border-radius:16px}
.show-a{flex:1;font:inherit;font-weight:800;font-size:1.02rem;border:0;border-radius:16px;padding:15px;cursor:pointer;background:var(--acc);color:var(--ink);box-shadow:0 12px 30px color-mix(in srgb,var(--acc) 35%,transparent)}
.show-a:disabled{opacity:.4;cursor:default;box-shadow:none}
.mnd{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:10px 10px 10px;box-shadow:0 -10px 40px #0008}
.mnd-h{margin:0 4px 8px;font-size:.78rem}
.rb{padding:8px 2px 7px;background:#0000002a}
.rb b{font-size:.78rem}
.rb.r0 b{color:#F07A74}.rb.r1 b{color:#F5A47E}.rb.r2 b{color:#6FD3C9}.rb.r3 b{color:#5ED497}
.hint{font-size:.74rem;color:var(--mut);text-align:center;margin:0}
@media (min-width:700px){.card{height:clamp(380px,calc(100dvh - 400px),560px)}}

.covT{font-size:.74rem;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.hoy{gap:8px;padding:12px 14px}
.kpi div{flex-direction:row;align-items:baseline;gap:6px;padding:6px 10px}
.kpi b{font-size:1.15rem}
.mode button{white-space:nowrap}
.ftog .tg{white-space:nowrap}
.tools input[type=search]{flex:1 1 120px}
@media (max-width:600px){.hoy .sub{display:none}.kpi{gap:6px}.kpi div{padding:6px 8px;gap:4px}.kpi span{font-size:.66rem}.hoy h1{font-size:1.1rem}}

/* Barra mínima + panel de configuración */
.head{gap:10px}
.bk,.gear{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--fg);cursor:pointer;padding:0}
.bk svg,.gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gear svg{transition:transform .3s}.gear:hover svg{transform:rotate(30deg)}
.ctx{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:.8rem;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.ctx i{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--acc)}
.ctx span{overflow:hidden;text-overflow:ellipsis}.ctx b{color:var(--acc);font-weight:800}
#study .deck{margin-top:22px!important}
.cbar .mini{font-size:.8rem;color:var(--mut)}.cbar .mini b{color:var(--amber);font-variant-numeric:tabular-nums}
.scrim{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:88dvh;transform:translate(-50%,102%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;z-index:41;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 60px #0008}
body.cfg .scrim{opacity:1;pointer-events:auto}
body.cfg .sheet{transform:translate(-50%,0);visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
body.cfg{overflow:hidden}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 0;flex-shrink:0}
.sh{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 6px;flex-shrink:0}
.sh h2{margin:0;font-family:var(--f-head);font-size:1.2rem}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.sb{overflow:auto;padding:6px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:9px}
.gt{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sheet .tabs{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.sheet .fsz{align-self:flex-start}
.sheet .filters{flex-wrap:wrap;overflow:visible}
.okb{font:inherit;background:var(--acc);color:var(--ink);border:0;border-radius:14px;padding:13px;font-weight:800;font-size:1rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="bk" href="./" aria-label="Volver a la app"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <button class="ctx" id="ctx" type="button" aria-label="Abrir configuración"><i id="ctxDot"></i><span id="ctxTxt">Flashcards</span></button>
    <button class="gear" id="gear" type="button" aria-label="Configuración"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  

  <div id="gateBox" hidden></div>

  <div id="study" hidden style="display:flex;flex-direction:column;gap:12px">
    
    
    <div class="cbar"><span id="n"></span><span class="mini"><b id="miniDue">0</b> para hoy</span></div>
    <div class="deck" id="deck">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Girar tarjeta">
        <div class="face front" id="front"><div class="empty">Cargando tarjetas…</div></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="grab"></div>
  <div class="sh"><h2 id="shT">Configuración</h2><button class="x" id="shX" type="button" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sb">
    <div class="grp"><span class="gt">Sección</span><div class="tabs" role="group" aria-label="Sección" id="bank"></div></div>
    <section class="hoy" aria-label="Tu progreso">
      <div class="hoy-t"><h1 id="title">Flashcards</h1><span class="covT" id="covT"></span></div>
      <p class="sub" id="sub"></p><span id="mndInfo" hidden></span>
      <div class="kpi"><div class="k1"><b id="kDue">0</b><span>para hoy</span></div><div class="k2"><b id="kLear">0</b><span>aprendiendo</span></div><div class="k3"><b id="kCons">0</b><span>consolidadas</span></div></div>
      <div class="pbar" aria-hidden="true"><i id="pk" style="background:var(--ok)"></i><i id="pa" style="background:var(--orange)"></i></div>
    </section>
    <div class="grp"><span class="gt">Qué estudiar</span><div class="mode" role="group" aria-label="Modo">
      <button type="button" id="mDue" aria-pressed="true">🔁 Repaso de hoy <span class="ct" id="cDue">0</span></button>
      <button type="button" id="mAll" aria-pressed="false">📚 Explorar</button>
    </div>
    <div id="allTools" hidden style="display:flex;flex-direction:column">
      <div class="filters" id="filters" role="group" aria-label="Filtrar por área"></div>
      <div class="tools">
        <select id="tema" aria-label="Tema"></select>
        <input type="search" id="buscar" placeholder="Buscar (ej. pancreatitis)" aria-label="Buscar">
      </div>
      <div class="ftog"><button class="tg" type="button" id="nue" aria-pressed="false">Solo nuevas</button><button class="tg" type="button" id="rep" aria-pressed="false">Repetidas</button><button class="tg" type="button" id="mix" aria-pressed="false">Mezclar</button></div>
    </div></div>
    <div class="grp"><span class="gt">Tamaño de letra</span><div class="fsz" role="group" aria-label="Tamaño de letra"><button type="button" id="fm" aria-label="Letra más chica" style="font-size:.8rem">A−</button><span id="fv">100%</span><button type="button" id="fp" aria-label="Letra más grande" style="font-size:1.05rem">A+</button></div></div>
    <button class="okb" id="shOk" type="button">Listo</button>
  </div>
</div>
<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div class="dock-row" id="dShow">
      <button class="arrow" id="prev" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="show-a" id="showA" type="button">Ver respuesta</button>
      <button class="arrow" id="next" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="mnd" id="mnd" hidden>
      <div class="mnd-h"><span><b>Método Mandu’a</b> · ¿La sabías? Vuelve en:</span></div>
      <div class="rg" id="rg"></div>
    </div>
    <p class="hint" id="mndS"></p>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase-2.45.4.min.js"></script>
<script>
const C=window.CONFIG||{};
const COL={"Medicina Interna":"#4CC2B7","Cirugía":"#F08A5D","Pediatría":"#93A4FF","Gineco-Obstetricia":"#E879A6","Salud Pública":"#E2B24A"};
const SEC={CONAREM:{t:"Flashcards <em>CONAREM</em>",s:"Las preguntas de los exámenes CONAREM 2016–2026, con la respuesta y la perla para recordar.",need:"conarem"},
 UNA:{t:"Flashcards <em>Examen Único UNA</em>",s:"Las preguntas del Examen Único de Residencias de la FCM-UNA, con la respuesta y la perla.",need:"una"},
 Carrera:{t:"Flashcards <em>Carrera</em>",s:"Mazos por tema para estudiar en la facultad: preguntas, verdadero o falso y completá.",soon:1},
 Residencia:{t:"Flashcards <em>Residencia</em>",s:"Manejo práctico para el residente: metas, fármacos, urgencias y emergencias.",soon:1}};
const STEPS=[1,3,7,14,30,60];
const $=id=>document.getElementById(id);
const st=k=>{try{return localStorage.getItem(k)}catch(e){return null}},ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const TAP='<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>';
const BOOK='<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></svg>';
const glo=g=>g&&g.length?`<div class="gl"><div class="gh">Siglas y términos</div>${g.map(([t,e])=>`<p><b>${esc(t)}</b>: ${esc(e)}</p>`).join('')}</div>`:'';
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function fmtD(n){if(n===1)return'mañana';if(n<30)return n+' días';const m=Math.round(n/30);return m===1?'1 mes':m+' meses'}
// Mandu'a: mismos pasos que el banco (1, 3, 7, 14, 30, 60 días)
function srsIdx(pi,r){if(r===0)return 0;const k=r-1;if(pi<0)return [1,3,4][k];return Math.min(STEPS.length-1,[Math.max(pi,1),Math.max(pi+1,2),Math.max(pi+2,3)][k])}
function prevIdx(id){const o=P.srs[id];if(!o)return -1;return o.last===todayKey()?o.pi:o.i}

let sb=null,uid=null,ACC={},CARDS={},P={srs:{}},bank=st('am_flash_bank')||'CONAREM',mode='due',area='Todas',tema='',q='',onlyRep=false,onlyNew=false,mixed=false,list=[],i=0,flipped=false,saveT=null;
if(!SEC[bank])bank='CONAREM';

function paintBank(){$('bank').innerHTML=Object.keys(SEC).map(b=>{const S=SEC[b];const lk=uid&&S.need&&!ACC[S.need]&&!ACC.admin;const lab=b==='UNA'?'Examen UNA':b;return `<button type="button" data-b="${b}" aria-pressed="${b===bank}">${lab}${lk?'<span class="lk" aria-label="bloqueado">🔒</span>':''}${S.soon?'<span class="pr">Pronto</span>':''}</button>`}).join('');
 $('bank').querySelectorAll('button').forEach(x=>x.onclick=()=>setBank(x.dataset.b))}
function gate(html){$('gateBox').innerHTML=html;$('gateBox').hidden=false;$('study').hidden=true;$('dock').hidden=true}
async function setBank(b){bank=b;ss('am_flash_bank',b);area='Todas';tema='';document.body.classList.toggle('una',b==='UNA');paintBank();paintCtx();
 $('title').innerHTML=SEC[b].t;$('sub').textContent=SEC[b].s;
 if(!uid){gate(`<div class="lock"><div class="ic">📇</div><h2>Iniciá sesión para usar tus flashcards</h2><p>Las flashcards de la CONAREM y del Examen Único UNA vienen incluidas en los planes del banco de preguntas, con el método Mandu’a para repasar.</p><a class="btn" href="./#acceso">Iniciar sesión</a><a class="btn gh" href="./#planes">Ver los planes</a></div>`);return}
 let src=b;
 if(SEC[b].soon){if(!ACC.admin){gate(`<div class="lock"><div class="ic">🛠️</div><h2>Próximamente</h2><p>${b==='Carrera'?'Estamos armando mazos por tema para la facultad. El primero: Hipertensión arterial.':'Estamos armando mazos de manejo práctico para residentes. El primero: Hipertensión arterial.'}</p><a class="btn gh" href="./">Volver a la app</a></div>`);return}src='MAZO'}
 else if(!ACC[SEC[b].need]&&!ACC.admin){gate(`<div class="lock"><div class="ic">🔒</div><h2>Incluidas en el plan del banco ${b==='UNA'?'del Examen Único UNA':'de la CONAREM'}</h2><p>Las flashcards ${b==='UNA'?'del Examen Único de Residencias de la FCM-UNA':'de la CONAREM'} se activan con el plan de ese banco de preguntas.</p><a class="btn" href="./${b==='UNA'?'#una':'#planes'}">Ver los planes</a></div>`);return}
 $('gateBox').hidden=true;$('study').hidden=false;$('dock').hidden=false;
 if(src==='MAZO'){$('gateBox').hidden=false;$('gateBox').innerHTML='<p class="adm">Vista de administrador: esta sección todavía no está publicada para los alumnos.</p>'}
 if(!CARDS[src]){$('front').innerHTML='<div class="empty">Cargando tarjetas…</div>';$('back').innerHTML='';
  try{CARDS[src]=await loadCards(src)}catch(e){$('front').innerHTML='<div class="empty">No se pudieron cargar las tarjetas. Recargá la página.</div>';return}}
 mode=dueList().length?'due':'all';paintFilters();rebuild()}
async function loadCards(b){let out=[],from=0;for(;;){const {data,error}=await sb.from('flashcards').select('data').eq('bank',b).order('ord').range(from,from+999);if(error)throw error;out=out.concat(data.map(r=>r.data));if(data.length<1000)break;from+=1000}
 if(b==='MAZO')out=out.filter(c=>(c.s||[]).includes(bank));return out}
function pool(){return CARDS[SEC[bank].soon?'MAZO':bank]||[]}
function dueList(){const t=todayKey();return pool().filter(c=>{const o=P.srs[c.id];return o&&o.due<=t&&o.last!==t}).sort((a,b)=>P.srs[a.id].due.localeCompare(P.srs[b.id].due))}
function areas(){return ["Todas",...Object.keys(COL).filter(a=>pool().some(c=>c.ar===a))]}
function paintFilters(){
 $('filters').innerHTML=areas().map(a=>`<button type="button" aria-pressed="${a===area}" data-a="${a}">${a==="Todas"?'':`<i style="background:${COL[a]}"></i>`}${a}</button>`).join('');
 $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{area=b.dataset.a;tema="";paintFilters();rebuild()});
 const ts=[...new Set(pool().filter(c=>area==="Todas"||c.ar===area).map(c=>c.t).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
 $('tema').innerHTML='<option value="">Todos los temas</option>'+ts.map(t=>`<option ${t===tema?'selected':''}>${esc(t)}</option>`).join('')}
function rebuild(){
 $('mDue').setAttribute('aria-pressed',mode==='due');$('mAll').setAttribute('aria-pressed',mode==='all');$('allTools').hidden=mode!=='all';
 if(mode==='due')list=dueList();
 else{const nq=norm(q);list=pool().filter(c=>(area==="Todas"||c.ar===area)&&(!tema||c.t===tema)&&(!onlyRep||c.n>1)&&(!onlyNew||!P.srs[c.id])&&(!nq||norm(c.q+' '+c.a+' '+c.t).includes(nq)));
  if(mixed){for(let k=list.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[list[k],list[j]]=[list[j],list[k]]}}}
 i=0;show();paintCtx();requestAnimationFrame(fitCard)}
function show(){const card=$('card');card.classList.remove('flip');flipped=false;stats();
 if(!list.length){$('front').innerHTML=mode==='due'?`<div class="done"><div class="ic">🎉</div><b>No tenés repasos pendientes</b><span>${Object.keys(P.srs).length?'Volvé mañana o seguí con tarjetas nuevas.':'Empezá con tarjetas nuevas: las que califiques vuelven acá justo antes de que las olvides.'}</span><button class="btn" type="button" onclick="event.stopPropagation();goNew()">Estudiar tarjetas nuevas</button></div>`:'<div class="empty">No hay tarjetas con estos filtros.</div>';$('back').innerHTML='';$('n').textContent='0 tarjetas';rates();return}
 const c=list[i],col=COL[c.ar]||'#4CC2B7';card.style.setProperty('--c',col);
 const yrs=c.y&&c.y.length?(c.b==="UNA"?'FCM-UNA ':'CONAREM ')+c.y.join(' · '):(c.mz==='HTA'?'Mazo Hipertensión':'Pregunta de práctica');
 const o=P.srs[c.id];const st0=o?(o.ok?'<span class="kd">Repaso</span>':'<span class="rep">Vuelve a repasar</span>'):'';
 const tags=st0+(c.k?`<span class="kd">${esc(c.k)}</span>`:'')+(c.n>1?`<span class="rep">Salió ${c.n} veces</span>`:'')+(c.x?'<span class="exc">Ojo: pide la excepción</span>':'');
 $('front').innerHTML=`<div class="band"></div><div class="fin"><div class="wm">?</div><div class="top"><span class="tema">${esc(c.ar)}<small>${esc(c.t||'')}</small></span><span class="yr">${yrs}</span></div>${tags?`<div class="tags">${tags}</div>`:''}<p class="q">${esc(c.q)}</p>${glo(c.g)}<div class="tap">${TAP}Tocá para ver la respuesta</div></div>`;
 $('back').innerHTML=`<div class="band"></div><div class="bin"><span class="lab">${c.x?'Es la excepción (la que no corresponde)':'Respuesta'}</span><div class="a">${esc(c.a)}</div>${c.d?`<p class="d" lang="es">${c.d}</p>`:''}${glo(c.gb)}${c.f?`<div class="src">${BOOK}<span>${esc(c.f)}</span></div>`:''}</div>`;
 $('n').textContent=`Tarjeta ${i+1} de ${list.length}`+(mode==='due'?' · repaso de hoy':'');rates()}
function rates(){requestAnimationFrame(fitCard);const c=list[i];const lab=['No la sabía','Difícil','Bien','Fácil'],em=['😵','😓','🙂','😎'];
 const pi=c?prevIdx(c.id):-1;
 $('rg').innerHTML=lab.map((l,r)=>`<button type="button" class="rb r${r}" data-r="${r}"><span class="re">${em[r]}</span><b>${l}</b><small>${fmtD(STEPS[srsIdx(pi,r)])}</small></button>`).join('');
 $('rg').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
 $('mnd').hidden=!(c&&flipped);$('dShow').hidden=!!(c&&flipped);$('showA').disabled=!c;
 $('mndS').textContent=!c?'':flipped?'Tocá la tarjeta para volver a ver la pregunta':'Pensá la respuesta y después tocá «Ver respuesta»'}
function rate(r){const c=list[i];if(!c)return;const t=todayKey();const pi=prevIdx(c.id);const ni=srsIdx(pi,r);
 P.srs[c.id]={i:ni,pi,last:t,due:addDays(t,STEPS[ni]),ok:r>0};save();
 if(mode==='due'){list.splice(i,1);if(i>=list.length)i=0;show()}else{i=(i+1)%list.length;show()}}
function stats(){const all=pool();const ids=new Set(all.map(c=>c.id));const t=todayKey();let due=0,cons=0,lear=0;
 for(const id in P.srs){if(!ids.has(id))continue;const o=P.srs[id];if(o.due<=t&&o.last!==t)due++;if(o.ok&&o.i>=3)cons++;else lear++}
 $('cDue').textContent=due;$('miniDue').textContent=due;$('kDue').textContent=due;$('kLear').textContent=lear;$('kCons').textContent=cons;
 const seen=cons+lear;$('covT').textContent=all.length?`${seen.toLocaleString('es')} de ${all.length.toLocaleString('es')} vistas`:'';$('mndInfo').textContent='';
 $('pk').style.width=(all.length?cons/all.length*100:0)+'%';$('pa').style.width=(all.length?lear/all.length*100:0)+'%'}
function save(){ss('am_fsrs_'+uid,JSON.stringify(P));clearTimeout(saveT);saveT=setTimeout(()=>{sb.from('flash_progress').upsert({user_id:uid,data:P,updated_at:new Date().toISOString()}).then(()=>{})},1200)}
function merge(a,b){const out={srs:Object.assign({},a.srs||{})};for(const id in (b.srs||{})){const x=out.srs[id],y=b.srs[id];if(!x||(y.last||'')>(x.last||''))out.srs[id]=y}return out}
function goNew(){mode='all';onlyNew=true;$('nue').setAttribute('aria-pressed','true');paintFilters();rebuild()}
function fitCard(){const c=$('card'),d=$('dock');if(!c||$('study').hidden)return;const top=c.getBoundingClientRect().top+scrollY;const h=Math.max(300,Math.min(580,innerHeight-d.offsetHeight-top-6));c.style.height=h+'px'}
addEventListener('resize',()=>fitCard());
function go(d){if(!list.length)return;i=(i+d+list.length)%list.length;show()}
let sx=null,moved=false;
$('card').addEventListener('pointerdown',e=>{sx=e.clientX;moved=false});
$('card').addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60){moved=true;go(dx<0?1:-1)}});
function flip(){if(!list.length)return;$('card').classList.toggle('flip');if($('card').classList.contains('flip')&&!flipped){flipped=true;rates()}}
$('card').addEventListener('click',()=>{if(!moved)flip()});
$('card').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('showA').onclick=()=>{if(!$('card').classList.contains('flip'))flip()};
$('mDue').onclick=()=>{mode='due';rebuild()};$('mAll').onclick=()=>{mode='all';paintFilters();rebuild()};
$('tema').onchange=e=>{tema=e.target.value;rebuild()};
let tq;$('buscar').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{q=e.target.value.trim();rebuild()},200)};
const tog=(id,f)=>$(id).onclick=()=>{const v=$(id).getAttribute('aria-pressed')!=="true";$(id).setAttribute('aria-pressed',v);f(v);rebuild()};
tog('rep',v=>onlyRep=v);tog('nue',v=>onlyNew=v);tog('mix',v=>mixed=v);
document.addEventListener('keydown',e=>{if(document.body.classList.contains('cfg'))return;if(/BUTTON|INPUT|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(flipped&&/^[1-4]$/.test(e.key))rate(+e.key-1)});

function paintCtx(){const lab=bank==='UNA'?'Examen UNA':bank;let det=mode==='due'?'Repaso de hoy':(tema||(area==='Todas'?'Explorar':area));
 $('ctxDot').style.background=mode==='all'&&area!=='Todas'&&COL[area]?COL[area]:'';$('ctxTxt').innerHTML=`<b>${esc(lab)}</b> · ${esc(det)}`}
function openCfg(){document.body.classList.add('cfg');setTimeout(()=>$('shX').focus(),60)}
function closeCfg(){document.body.classList.remove('cfg');requestAnimationFrame(fitCard)}
$('gear').onclick=openCfg;$('ctx').onclick=openCfg;$('shX').onclick=closeCfg;$('shOk').onclick=closeCfg;$('scrim').onclick=closeCfg;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('cfg'))closeCfg()});
const FS=[.85,1,1.15,1.3,1.45];let fk=1;{const s=+st('am_flash_fs');if(FS.includes(s))fk=FS.indexOf(s)}
function fsz(){const v=FS[fk];$('card').style.setProperty('--k',v);$('fv').textContent=Math.round(v*100)+'%';$('fm').disabled=fk===0;$('fp').disabled=fk===FS.length-1;ss('am_flash_fs',v)}
$('fm').onclick=()=>{if(fk>0){fk--;fsz()}};$('fp').onclick=()=>{if(fk<FS.length-1){fk++;fsz()}};fsz();
(async()=>{
 try{sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,lock:async(n,t,fn)=>await fn()}});
  const {data:{session}}=await sb.auth.getSession();uid=session&&session.user&&session.user.id||null;
  if(uid){const r=await sb.rpc('flash_access');ACC=r.data||{};
   try{P=JSON.parse(st('am_fsrs_'+uid)||'{"srs":{}}')}catch(e){P={srs:{}}}
   const {data}=await sb.from('flash_progress').select('data').eq('user_id',uid).maybeSingle();if(data&&data.data)P=merge(P,data.data)}
 }catch(e){}
 setBank(bank)})();
</script>
</body>
</html>
